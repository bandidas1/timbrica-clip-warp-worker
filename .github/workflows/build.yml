name: build-and-push

on:
  push:
    branches: [main]
    paths:
      - "handler.py"
      - "motion.py"
      - "motion_selftest.py"
      - "upload_selftest.py"
      - "schedule_selftest.py"
      - "download_models.py"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Motion maths (pulse-to-music, 24 fps midpoints) is pure Python and the
      # only part of the loop that can be checked without a GPU — a red self-test
      # must stop the image here, not after a 13-minute paid run.
      - name: Motion self-test
        run: python3 motion_selftest.py

      # Delivery of the finished clip (slices + retry, 2026-10-29): a red
      # self-test here means a 10-minute render would be thrown away on the
      # first dropped connection again — stop the image before it ships.
      - name: Upload self-test
        run: python3 upload_selftest.py

      # Scene schedule and redo ranges (2026-10-29): the app splices redone
      # scenes back by these frame numbers — one frame off is a flashing frame
      # of the neighbouring scene in someone's clip.
      - name: Schedule self-test
        run: python3 schedule_selftest.py

      # torch-cu124 + baked SD weights ≈ 8 GB — free the runner disk first.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/timbrica-clip-warp-worker:latest
            ghcr.io/${{ github.repository_owner }}/timbrica-clip-warp-worker:${{ github.sha }}
          provenance: false
