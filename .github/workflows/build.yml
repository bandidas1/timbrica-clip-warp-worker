name: build-and-push

on:
  push:
    branches: [main]
    paths:
      - "handler.py"
      - "download_models.py"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # torch-cu124 + baked SD weights ≈ 8 GB — free the runner disk first.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/timbrica-clip-warp-worker:latest
            ghcr.io/${{ github.repository_owner }}/timbrica-clip-warp-worker:${{ github.sha }}
          provenance: false
